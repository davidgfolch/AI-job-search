# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: ["master", "staging"]
  pull_request:
    branches: ["master", "staging"]

permissions:
  contents: write
  checks: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.build-matrix.outputs.modules }}
      e2e: ${{ steps.build-matrix.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apps/commonlib: apps/commonlib/**
            apps/scrapper: apps/scrapper/**
            apps/aiEnrich: apps/aiEnrich/**
            apps/aiEnrichNew: apps/aiEnrichNew/**
            apps/aiEnrichSkill: apps/aiEnrichSkill/**
            apps/aiEnrich3: apps/aiEnrich3/**
            apps/aiCvMatcher: apps/aiCvMatcher/**
            apps/aiFormFiller: apps/aiFormFiller/**
            apps/backend: apps/backend/**
            apps/web: apps/web/**
            apps/cron: apps/cron/**
            apps/e2e: apps/e2e/**
            all:
              - .github/**
              - docker-compose.yml
              - pyproject.toml
              - poetry.lock
              - uv.lock

      - name: Build module matrix
        id: build-matrix
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os
          all_modules = ["apps/commonlib","apps/scrapper","apps/aiEnrich","apps/aiEnrichNew","apps/aiEnrichSkill","apps/aiEnrich3","apps/aiCvMatcher","apps/aiFormFiller","apps/backend","apps/web","apps/cron"]
          dependents = [m for m in all_modules if m != "apps/web"]
          raw = os.environ.get("CHANGED", "").strip()
          changed = json.loads(raw) if raw else []
          if "all" in changed:
              modules = all_modules
          else:
              modules = [m for m in changed if m not in ("all", "apps/e2e")]
              if "apps/commonlib" in modules:
                  modules += [m for m in dependents if m not in modules]
          e2e = "apps/e2e" in changed or "apps/web" in modules
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"modules={json.dumps(modules)}\n")
              f.write(f"e2e={'true' if e2e else 'false'}\n")
          EOF
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}

  test:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          
      - name: Install global tools
        run: |
          cp 'scripts/.env.secrets.example' .env.secrets
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install and Test ${{ matrix.module }}
        run: |
          MODULE="${{ matrix.module }}"
          SAFE_MODULE="${MODULE//\//-}"
          echo "ARTIFACT_NAME=badge-${SAFE_MODULE}" >> $GITHUB_ENV
          
          cd "${MODULE}"
          
          if [ -f "package.json" ]; then
            npm install
            npm test -- run --coverage
            npx coverage-badges --label "${MODULE}"
            mkdir -p coverage_artifacts
            cp coverage/badges.svg coverage_artifacts/coverage.svg
          elif [ "${MODULE}" == "apps/backend" ] || [ "${MODULE}" == "apps/aiEnrich" ] || [ "${MODULE}" == "apps/aiEnrichNew" ] || [ "${MODULE}" == "apps/aiEnrichSkill" ] || [ "${MODULE}" == "apps/aiEnrich3" ] || [ "${MODULE}" == "apps/aiCvMatcher" ] || [ "${MODULE}" == "apps/aiFormFiller" ] || [ "${MODULE}" == "apps/cron" ]; then
            uv sync
            uv run coverage run -m pytest
            uv run coverage xml
            uv run genbadge coverage -i coverage.xml -o coverage.svg -n "${MODULE}"
            uv run coverage report -m || true
          else
            # apps/commonlib, apps/scrapper
            poetry lock
            poetry install --no-interaction
            poetry run coverage run -m pytest
            poetry run coverage xml
            poetry run genbadge coverage -i coverage.xml -o coverage.svg -n "${MODULE}"
            poetry run coverage report -m || true
          fi
          
      - name: Upload coverage badge
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ matrix.module }}/coverage.svg
            ${{ matrix.module }}/coverage_artifacts/coverage.svg

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install e2e dependencies
        run: npm install
        working-directory: apps/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/e2e

      - name: Run e2e tests
        run: npm test
        working-directory: apps/e2e

      - name: Generate coverage badge
        if: success()
        run: |
          npx coverage-badges --label "apps/e2e"
          mkdir -p coverage_artifacts
          cp coverage/badges.svg coverage_artifacts/coverage.svg
        working-directory: apps/e2e

      - name: Upload coverage badge
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badge-apps-e2e
          path: |
            apps/e2e/coverage.svg
            apps/e2e/coverage_artifacts/coverage.svg

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  update-badges:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging') && needs.test.result != 'failure' && needs.e2e.result != 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout badges branch
        run: |
          git fetch origin badges
          git checkout badges

      - name: Download all badges
        if: needs.test.result == 'success' || needs.e2e.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/badges

      - name: Commit coverage badges
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          changes=false
          MODULES="apps/commonlib apps/scrapper apps/aiEnrich apps/aiEnrichNew apps/aiEnrichSkill apps/aiEnrich3 apps/aiCvMatcher apps/aiFormFiller apps/backend apps/web apps/cron apps/e2e"
          read -ra MODULE_ARR <<< "${MODULES}"
          
          for MODULE in "${MODULE_ARR[@]}"; do
            echo "Processing $MODULE"
            
            # Construct artifact name using same logic as test job
            SAFE_MODULE="${MODULE//\//-}"
            ARTIFACT_NAME="badge-${SAFE_MODULE}"
            
            # Define where the badge should go in the repo
            if [ "$MODULE" == "apps/web" ]; then
                TARGET_PATH="${MODULE}/coverage/badges.svg"
            else
                TARGET_PATH="${MODULE}/coverage.svg"
            fi
            
            # Find the downloaded badge
            # Search recursively within the artifact directory because upload-artifact v4 might preserve directory structure
            SOURCE_PATH=$(find "/tmp/badges/${ARTIFACT_NAME}" -name "coverage.svg" -type f | head -n 1)
            
            if [ -n "$SOURCE_PATH" ]; then
              echo "Found new badge at $SOURCE_PATH"
              
              # Ensure directory exists
              mkdir -p "$(dirname "$TARGET_PATH")"
              
              # Copy new badge
              cp "$SOURCE_PATH" "$TARGET_PATH"
              
              if git diff --quiet "$TARGET_PATH"; then
                echo "No changes for $MODULE"
              else
                 echo "Changes detected for $MODULE"
                 git add "$TARGET_PATH"
                 changes=true
              fi
            else
               echo "No badge found for $MODULE in /tmp/badges/${ARTIFACT_NAME}"
               ls -R "/tmp/badges/${ARTIFACT_NAME}" || true
            fi
          done
          
          if $changes; then
            git commit -m "Update coverage badges"
            # Xtheirs ignore conflicts keeping this commit version
            git pull --rebase -Xtheirs
            # The badge commit only touches *.svg files whose parent passed the full matrix.
            # Report the required ci-gate check for this SHA so the push to the protected branch is allowed.
            BADGE_SHA=$(git rev-parse HEAD)
            curl -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/check-runs" \
              -d "{\"name\":\"ci-gate\",\"head_sha\":\"${BADGE_SHA}\",\"status\":\"completed\",\"conclusion\":\"success\"}"
            git push
          else
            echo "No coverage badge files changed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    needs: [changes, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on upstream failure
        run: |
          if [ "${{ needs.changes.result }}" == "failure" ] || [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.e2e.result }}" == "failure" ]; then
            echo "One or more CI jobs failed" >&2
            exit 1
          fi
