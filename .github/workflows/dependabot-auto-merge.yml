name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
    branches: ["staging"]

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: |
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      (contains(github.event.pull_request.head.ref, 'minor-patch') ||
       contains(github.event.pull_request.head.ref, 'github-actions'))
    runs-on: ubuntu-latest
    steps:
      - name: Skip if PR contains a semver-major update
        id: check-major
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if printf '%s' "$PR_BODY" | grep -q "version-update:semver-major"; then
            echo "skipping" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.check-major.outputs.skipping == ''
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
