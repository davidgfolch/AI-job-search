name: Auto-merge Dependabot PRs

# pull_request_target, not pull_request: runs triggered by Dependabot get a read-only
# GITHUB_TOKEN and no repository secrets, so `gh pr merge --auto` could never succeed
# (that is why every merge used to be manual). pull_request_target runs in the base
# repository context with a write-capable token. Nothing untrusted is checked out here,
# and the token is only used for the single merge call below.
on:
  pull_request_target:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
    branches: ["staging"]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      (contains(github.event.pull_request.head.ref, 'minor-patch') ||
       contains(github.event.pull_request.head.ref, 'github-actions'))
    runs-on: ubuntu-latest
    steps:
      - name: Skip if PR contains a semver-major update
        id: check-major
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if printf '%s' "$PR_BODY" | grep -q "version-update:semver-major"; then
            echo "skipping" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.check-major.outputs.skipping == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --auto
