[project]
name = "scrapper"
version = "0.1.0"
description = "Scrapper"
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "commonlib==0.1.0",
    "selenium>=4.37.0,<5.0.0",
    "markdownify==1.2.3",
    "undetected-chromedriver==3.5.5",
    "tabulate>=0.9.0",
    "scrapling (>=0.4.15,<0.5.0)",
    "curl-cffi (>=0.16.3,<0.17.0)",
    "playwright (>=1.62.0,<2.0.0)",
    "camoufox (>=0.5.6,<0.6.0)",
    "patchright (>=1.63.0,<2.0.0)",
    "msgspec (>=0.21.1,<0.22.0)",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
commonlib = { path = "../../apps/commonlib/", develop = true }
selenium = ">=4.50.0,<5.0.0"
markdownify = "1.2.3"
undetected-chromedriver = "3.5.5"
tabulate = ">=0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.0.0"
genbadge = {extras = ["coverage"], version = "1.1.3"}

[tool.coverage.run]
branch = true
source = ["scrapper"]
# Tests live inside the package, so without omit they are measured as if they
# were production code: 2981 of 6215 measured lines (48%) at 99% coverage, which
# inflated the badge by ~8.8 points over the real 80.8% of production code.
omit = ["*/test/*", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
# No fail_under here on purpose: coverage.py only compares the branch-inclusive
# total, and the project gates statements/lines only. scripts/coverage/scrapper_coverage_gate.py
# enforces the 90% floor on production statements and lines; branches stay informational.

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"